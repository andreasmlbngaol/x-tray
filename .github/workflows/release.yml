name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Read version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew :core:jvmTest :platform:jvmTest --no-daemon

      - name: Build minified .deb
        run: >-
          ./gradlew :app:packageReleaseDeb --no-daemon
          -PappVersion=${{ steps.version.outputs.value }}

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp app/build/compose/binaries/main-release/deb/*.deb \
            "dist/x-tray_${{ steps.version.outputs.value }}_amd64.deb"
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true

  # jpackage only builds for the host OS, so the MSI needs a Windows runner.
  # It runs after the deb job so the release already exists for the upload.
  msi:
    needs: deb
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          "value=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Test
        run: .\gradlew.bat :core:jvmTest :platform:jvmTest --no-daemon

      - name: Build minified .msi
        run: >-
          .\gradlew.bat :app:packageReleaseMsi --no-daemon
          -PappVersion=${{ steps.version.outputs.value }}

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "app/build/compose/binaries/main-release/msi/*.msi" "dist/x-tray_${{ steps.version.outputs.value }}_x64.msi"
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          fail_on_unmatched_files: true

